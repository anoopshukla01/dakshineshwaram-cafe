<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Dakshineshwaram Café – South Indian Cuisine, Gorakhpur</title>
  
  <!-- SEO & Open Graph Meta Tags -->
  <meta name="description" content="Welcome to Dakshineshwaram Café, Gorakhpur. Authentic South Indian Cuisine: Crispy Dosas, Steaming Idlis, and Filter Kaapi. Simple Grains. Divine Flavours.">
  <meta name="keywords" content="Dakshineshwaram Cafe, Dakshineswaram Kafe, South Indian Restaurant Gorakhpur, Dosa Gorakhpur, Filter Coffee Gorakhpur, Mohaddipur Cafe">
  <meta property="og:title" content="Dakshineshwaram Café – South Indian Cuisine, Gorakhpur">
  <meta property="og:description" content="Simple Grains. Divine Flavours. Order online on Swiggy & Zomato, visit our cafe near Orion Mall, Gorakhpur.">
  <meta property="og:image" content="assets/brand_logo.png">
  <meta property="og:type" content="restaurant.restaurant">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dakshineshwaram Café – South Indian Cuisine, Gorakhpur">
  <meta name="twitter:description" content="Authentic South Indian Flavours in Gorakhpur. Mohaddipur, near Orion Mall.">
  <meta name="theme-color" content="#130602">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Dark Roasted Leather Background & Vignette -->
  <div class="bg-vignette" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <!-- Mobile-First Center Card Wrapper (~480px on desktop) -->
  <div class="card-frame-wrapper">
    <main class="cafe-hub-card" id="hubMain">

      <!-- 1. ORNATE GOLD DOUBLE-LINE BORDER & CORNER FLOURISHES -->
      <div class="card-border-ornament" aria-hidden="true">
        <!-- Top-Left Flourish -->
        <svg class="flourish-corner f-tl" viewBox="0 0 64 64" fill="none">
          <path d="M3 62V20C3 10.6 10.6 3 20 3H62" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
          <path d="M7 62V22C7 13.7 13.7 7 22 7H62" stroke="url(#goldStroke)" stroke-width="0.9" stroke-dasharray="2 2"/>
          <path d="M18 18C18 12.5 12.5 7 7 7" stroke="url(#goldStroke)" stroke-width="1.4"/>
          <path d="M28 7C28 18.6 18.6 28 7 28" stroke="url(#goldStroke)" stroke-width="1" stroke-opacity="0.6"/>
          <circle cx="18" cy="18" r="3.2" fill="url(#goldStroke)"/>
          <circle cx="28" cy="7" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="7" cy="28" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="3" cy="62" r="2" fill="url(#goldStroke)"/>
          <circle cx="62" cy="3" r="2" fill="url(#goldStroke)"/>
        </svg>

        <!-- Top-Right Flourish -->
        <svg class="flourish-corner f-tr" viewBox="0 0 64 64" fill="none">
          <path d="M61 62V20C61 10.6 53.4 3 44 3H2" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
          <path d="M57 62V22C57 13.7 50.3 7 42 7H2" stroke="url(#goldStroke)" stroke-width="0.9" stroke-dasharray="2 2"/>
          <path d="M46 18C46 12.5 51.5 7 57 7" stroke="url(#goldStroke)" stroke-width="1.4"/>
          <path d="M36 7C36 18.6 45.4 28 57 28" stroke="url(#goldStroke)" stroke-width="1" stroke-opacity="0.6"/>
          <circle cx="46" cy="18" r="3.2" fill="url(#goldStroke)"/>
          <circle cx="36" cy="7" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="57" cy="28" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="61" cy="62" r="2" fill="url(#goldStroke)"/>
          <circle cx="2" cy="3" r="2" fill="url(#goldStroke)"/>
        </svg>

        <!-- Bottom-Left Flourish -->
        <svg class="flourish-corner f-bl" viewBox="0 0 64 64" fill="none">
          <path d="M3 2V44C3 53.4 10.6 61 20 61H62" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
          <path d="M7 2V42C7 50.3 13.7 57 22 57H62" stroke="url(#goldStroke)" stroke-width="0.9" stroke-dasharray="2 2"/>
          <path d="M18 46C18 51.5 12.5 57 7 57" stroke="url(#goldStroke)" stroke-width="1.4"/>
          <path d="M28 57C28 45.4 18.6 36 7 36" stroke="url(#goldStroke)" stroke-width="1" stroke-opacity="0.6"/>
          <circle cx="18" cy="46" r="3.2" fill="url(#goldStroke)"/>
          <circle cx="28" cy="57" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="7" cy="36" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="3" cy="2" r="2" fill="url(#goldStroke)"/>
          <circle cx="62" cy="61" r="2" fill="url(#goldStroke)"/>
        </svg>

        <!-- Bottom-Right Flourish -->
        <svg class="flourish-corner f-br" viewBox="0 0 64 64" fill="none">
          <path d="M61 2V44C61 53.4 53.4 61 44 61H2" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round"/>
          <path d="M57 2V42C57 50.3 50.3 57 42 57H2" stroke="url(#goldStroke)" stroke-width="0.9" stroke-dasharray="2 2"/>
          <path d="M46 46C46 51.5 51.5 57 57 57" stroke="url(#goldStroke)" stroke-width="1.4"/>
          <path d="M36 57C36 45.4 45.4 36 57 36" stroke="url(#goldStroke)" stroke-width="1" stroke-opacity="0.6"/>
          <circle cx="46" cy="46" r="3.2" fill="url(#goldStroke)"/>
          <circle cx="36" cy="57" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="57" cy="36" r="1.8" fill="url(#goldStroke)"/>
          <circle cx="61" cy="2" r="2" fill="url(#goldStroke)"/>
          <circle cx="2" cy="61" r="2" fill="url(#goldStroke)"/>
        </svg>

        <svg class="svg-defs" width="0" height="0">
          <defs>
            <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fae392"/>
              <stop offset="40%" stop-color="#f5c46b"/>
              <stop offset="75%" stop-color="#d9902f"/>
              <stop offset="100%" stop-color="#934606"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- 5. TOP CORNER ACCENTS: BANANA LEAVES (TOP-LEFT) & HANGING BRASS LAMPS (TOP-RIGHT) -->
      <div class="top-corner-accents" aria-hidden="true">
        <!-- Top-Left Banana Leaves & Bell -->
        <img src="assets/corner_leaves_left.png" alt="Banana Leaves Decor" class="corner-leaves-left">

        <!-- Top-Right Hanging Brass Diya Lamps & Bells with Jasmine -->
        <div class="corner-lamps-wrap">
          <img src="assets/corner_lamps_right.png" alt="Hanging Brass Diya Lamps" class="corner-lamps-right">
          <div class="lamp-flame-point flame-tr1"></div>
          <div class="lamp-flame-point flame-tr2"></div>
        </div>
      </div>

      <!-- 2 & 3. TOP HEADER: OFFICIAL BRAND LOGO & TAGLINE -->
      <header class="hub-header">
        
        <!-- Official Logo Graphic with Green Kolam, 3D Gold Devanagari & Floral Divider -->
        <div class="brand-logo-wrap">
          <img src="assets/brand_logo.png" alt="दक्षिणेश्वरम कैफे - South Indian Cuisine" class="brand-logo-img">
        </div>

        <!-- Tagline: SIMPLE GRAINS. DIVINE FLAVOURS. -->
        <div class="tagline-block">
          <p class="tagline-text">SIMPLE GRAINS. DIVINE FLAVOURS.</p>
          <div class="gold-filigree-divider divider-lower">
            <span class="filigree-line"></span>
            <span class="filigree-diamond">❖</span>
            <span class="filigree-line"></span>
          </div>
        </div>

      </header>

      <!-- 6. 2-COLUMN GRID OF 6 OFFICIAL GRAPHIC LINK BUTTONS -->
      <section class="links-section" aria-label="Quick Links & Online Ordering">
        <div class="link-grid" id="linkGrid">

          <!-- 1. Order on Swiggy -->
          <a href="#" class="graphic-link-btn btn-swiggy" id="btnSwiggy" data-link="swiggy" target="_blank" rel="noopener noreferrer" aria-label="Order on Swiggy">
            <img src="assets/btn_swiggy.png" alt="Order on Swiggy" class="btn-graphic-img">
          </a>

          <!-- 2. Order on Zomato -->
          <a href="#" class="graphic-link-btn btn-zomato" id="btnZomato" data-link="zomato" target="_blank" rel="noopener noreferrer" aria-label="Order on Zomato">
            <img src="assets/btn_zomato.png" alt="Order on Zomato" class="btn-graphic-img">
          </a>

          <!-- 3. Chat on WhatsApp -->
          <a href="#" class="graphic-link-btn btn-whatsapp" id="btnWhatsapp" data-link="whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
            <img src="assets/btn_whatsapp.png" alt="Chat on WhatsApp" class="btn-graphic-img">
          </a>

          <!-- 4. Find us on Google Maps -->
          <a href="#" class="graphic-link-btn btn-maps" id="btnMaps" data-link="maps" target="_blank" rel="noopener noreferrer" aria-label="Find us on Google Maps">
            <img src="assets/btn_maps.png" alt="Find us on Google Maps" class="btn-graphic-img">
          </a>

          <!-- 5. Visit our Website -->
          <a href="#" class="graphic-link-btn btn-website" id="btnWebsite" data-link="website" target="_blank" rel="noopener noreferrer" aria-label="Visit our Website">
            <img src="assets/btn_website.png" alt="Visit our Website" class="btn-graphic-img">
          </a>

          <!-- 6. Review us on Google -->
          <a href="#" class="graphic-link-btn btn-review" id="btnReview" data-link="review" target="_blank" rel="noopener noreferrer" aria-label="Review us on Google">
            <img src="assets/btn_review.png" alt="Review us on Google" class="btn-graphic-img">
          </a>

        </div>
      </section>

      <!-- 7. SOCIAL ICONS IN GOLD-OUTLINED ROUNDED SQUARES -->
      <section class="socials-band">
        <div class="gold-filigree-divider divider-socials">
          <span class="filigree-line"></span>
          <span class="filigree-diamond">❖</span>
          <span class="filigree-line"></span>
        </div>

        <div class="socials-row">
          <!-- Instagram -->
          <a href="#" class="social-sq-btn" id="btnInstagram" data-link="instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>

          <!-- Facebook -->
          <a href="#" class="social-sq-btn" id="btnFacebook" data-link="facebook" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.99 3.66 9.13 8.44 9.88v-6.99H7.9V12h2.54V9.8c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.77l-.44 2.89h-2.33v6.99C18.34 21.13 22 16.99 22 12z"/>
            </svg>
          </a>

          <!-- YouTube -->
          <a href="#" class="social-sq-btn" id="btnYoutube" data-link="youtube" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5a3.02 3.02 0 0 0-2.12 2.14C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14c.5-1.88.5-5.81.5-5.81s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/>
            </svg>
          </a>
        </div>
      </section>

      <!-- 8. SCENIC KERALA BACKWATERS & HOUSEBOAT PANORAMA -->
      <section class="scenic-houseboat-section" aria-label="South Indian Heritage Landscape">
        <div class="backwater-houseboat-wrap">
          <img src="assets/backwater_houseboat.png" alt="Kerala Backwaters with Houseboat, Cottage and Palms" class="houseboat-panoramic-img">
        </div>
      </section>

      <!-- 9 & 10. FOOTER: LOCATION, PHONE & THE MARINER'S CAFE RIBBON -->
      <footer class="hub-footer">
        
        <!-- Contact Bar: Address & Phone -->
        <div class="footer-contacts-row">
          <!-- Address (Tappable -> Google Maps) -->
          <a href="#" class="footer-contact-link address-box" id="footerAddress" data-link="footer-map" target="_blank" rel="noopener noreferrer">
            <span class="contact-pin-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <span class="contact-address-text">
              Kasya Rd, Mohaddipur,<br>near Orion Mall, Gorakhpur
            </span>
          </a>

          <!-- Vertical Divider -->
          <div class="footer-v-divider" aria-hidden="true"></div>

          <!-- Phone Number (Tappable -> tel:) -->
          <a href="tel:+919565421321" class="footer-contact-link phone-box" id="footerPhone" data-link="footer-phone">
            <span class="contact-phone-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M15.5 13.5c-.5 0-1-.2-1.4-.6l-.8-.8c-.8-.8-2.1-.8-2.9 0l-.8.8c-.4.4-.9.6-1.4.6-1.1 0-2-.9-2-2 0-.5.2-1 .6-1.4l.8-.8c.8-.8.8-2.1 0-2.9l-.8-.8C6.2 5.2 6 4.7 6 4.2c0-1.1.9-2 2-2 .5 0 1 .2 1.4.6l.8.8c.8.8 2.1.8 2.9 0l.8-.8c.4-.4.9-.6 1.4-.6 1.1 0 2 .9 2 2 0 .5-.2 1-.6 1.4l-.8.8c-.8.8-.8 2.1 0 2.9l.8.8c.4.4.6.9.6 1.4 0 1.1-.9 2-2 2z"></path>
              </svg>
            </span>
            <span class="contact-phone-number">+91 95654 21321</span>
          </a>
        </div>

        <!-- 10. The Mariner's Cafe Ribbon Strip -->
        <div class="ribbon-container">
          <div class="scalloped-ribbon">
            <span class="ribbon-glyph wheel-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="7.5"></circle>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="12" y1="1.5" x2="12" y2="4.5"></line>
                <line x1="12" y1="19.5" x2="12" y2="22.5"></line>
                <line x1="1.5" y1="12" x2="4.5" y2="12"></line>
                <line x1="19.5" y1="12" x2="22.5" y2="12"></line>
                <line x1="4.6" y1="4.6" x2="6.7" y2="6.7"></line>
                <line x1="17.3" y1="17.3" x2="19.4" y2="19.4"></line>
                <line x1="19.4" y1="4.6" x2="17.3" y2="6.7"></line>
                <line x1="6.7" y1="17.3" x2="4.6" y2="19.4"></line>
              </svg>
            </span>

            <p class="ribbon-caption">
              <span class="ribbon-main">A venture managed by <strong class="mariner-bold">The Mariner’s Cafe</strong></span>
              <span class="ribbon-sub"><em>The Perfect Shore Leave</em></span>
            </p>

            <span class="ribbon-glyph anchor-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2.8"></circle>
                <line x1="12" y1="22" x2="12" y2="7.8"></line>
                <path d="M5 12H2a10 10 0 0 0 20 0h-3"></path>
              </svg>
            </span>
          </div>
        </div>

        <!-- 11. Copyright Line -->
        <div class="copyright-row">
          <span class="copyright-flourish" aria-hidden="true">❧</span>
          <p class="copyright-legal">© 2026 DAKSHINESHVARAM KAFE · GORAKHPUR</p>
          <span class="copyright-flourish flourish-flip" aria-hidden="true">❧</span>
        </div>

      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
